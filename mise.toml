[tools]
rust = { version = "1.98.1", profile = "minimal", components = ["clippy", "rustfmt"] }
node = "22.22.0"
"npm:markdownlint-cli2" = "0.23.2"
"cargo:styling-lint" = "0.1.0"
"github:rust-lang/mdBook" = "0.5.4"

[tasks.docs]
description = "Build the guide and workspace Rust API in _site (macOS)"
run = "cargo xtask docs"

[tasks.fmt]
description = "Format Rust source"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.lint-spacing]
description = "Check blank lines between Rust statement groups"
depends = ["fmt-check"]
run = "styling-lint check src tests xtask"

[tasks.fix-spacing]
description = "Format Rust and add blank lines between statement groups"
depends = ["fmt"]
run = "styling-lint fix src tests xtask"

[tasks.lint-md]
description = "Lint repository Markdown"
run = "markdownlint-cli2"

[tasks.fix-md]
description = "Apply Markdown lint fixes"
run = "markdownlint-cli2 --fix"

[tasks.clippy]
description = "Run strict Clippy, including the experimental nesting limit"
run = "cargo clippy --workspace --all-targets --offline -- -D warnings"

[tasks.oxisym]
description = "Run the Oxisym Rust lints"
run = "cargo dylint --git https://github.com/alfredr/oxisym --all -- --workspace --all-targets"

[tasks.test]
description = "Run Rust tests serially; set CHERENKOV_MODEL_DIR for model checks"
run = "cargo test --workspace --release --offline -- --test-threads=1"

[tasks.check-metal]
description = "Syntax-check the assembled Metal libraries with the real compiler"
run = "cargo xtask check-metal"

[tasks.clangd]
description = "Write kernels/.clangd so clangd sees each fragment as the assembler does"
run = "cargo xtask clangd"

[tasks.bench]
description = "Run the benchmark suite and generate pelicans"
run = "cargo xtask bench"

[tasks.smoke]
description = "Run live checks with a temporary server"
run = "cargo xtask smoke"
