name: Rust checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Formatting and hooks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Install Rust and linters
        uses: jdx/mise-action@v4
        with:
          install_args: rust node npm:markdownlint-cli2 cargo:styling-lint github:rhysd/actionlint shellcheck pre-commit
      - name: Run portable checks
        run: mise run check:portable

  test:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Install Rust
        uses: jdx/mise-action@v4
        with:
          install_args: rust
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2.9.2
        with:
          key: tests-${{ matrix.os }}-release
          cache-bin: false
      - name: Show GPU information
        run: system_profiler SPDisplaysDataType
      - name: Check Rust targets and run unit tests
        run: mise run check:native
      - name: Check Metal syntax and clangd configuration
        run: mise run check:metal

  coverage:
    name: Rust coverage
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Install Rust and coverage tools
        uses: jdx/mise-action@v4
        with:
          install_args: rust cargo:cargo-llvm-cov
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2.9.2
        with:
          # Keep instrumented dependencies separate from ordinary test builds.
          key: coverage-macos-26
          cache-bin: false
      - name: Run instrumented tests and generate reports
        run: mise run coverage
      - name: Add coverage to the job summary
        run: |
          {
            echo '## Rust test coverage'
            echo 'Rust source only; excludes test code and Metal shaders. Model-dependent tests skip without weights; unexecuted Rust paths remain in the totals.'
            echo '```text'
            cat target/coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage-${{ github.sha }}
          path: target/coverage/
          if-no-files-found: error
          retention-days: 90
