name: Authors

on:
  pull_request:

permissions:
  contents: read

jobs:
  authors:
    name: Author listed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the contribution
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install Rust
        uses: jdx/mise-action@v4
        with:
          install_args: rust
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2.9.2
        with:
          key: authors-ubuntu-latest
          cache-bin: false
      - name: Check AUTHORS
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: cargo xtask check-author "$PR_AUTHOR"
