name: Publish docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Rustdoc type-checks the Apple framework dependencies.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Install Rust and mdBook
        uses: jdx/mise-action@v4
        with:
          install_args: rust github:rust-lang/mdBook
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2.9.2
        with:
          key: docs-macos-26
          cache-bin: false
          # Includes the nested target/site-rustdoc dependency build.
          workspaces: ". -> target"
      - name: Test and build the site
        run: mise run check:docs
      - name: Check the book and Rust API output
        run: |
          test -s _site/index.html
          test -s _site/docs/rust-api.html
          test -s _site/api/index.html
          test -s _site/api/cherenkov/index.html
          test -s _site/api/xtask/index.html
          test -s _site/api/cherenkov/metal/index.html
          test -s _site/api/crates.js
          test -d _site/api/static.files
          test -d _site/api/src
      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Set up Pages
        uses: actions/configure-pages@v6
      - name: Publish the site
        uses: actions/deploy-pages@v5
        id: deployment
