[workspace]
members = [".", "xtask", "crates/model-data"]
default-members = ["."]
resolver = "3"

[package]
name = "cherenkov"
version = "0.1.0"
edition = "2024"
default-run = "cherenkov"
description = "Standalone qwen4-exp inference for Apple Silicon"
license = "MIT"
repository = "https://github.com/alfredr/cherenkov"
exclude = ["results/**", "benchmarks/**", "xtask/**", ".vscode/**", "tests/fixtures/qwen4_exp/*.safetensors", "tests/fixtures/qwen4_exp/tokenizer.json"]

[lints.rust]
dead_code = "deny"

[lints.clippy]
cognitive_complexity = "warn"
excessive_nesting = "warn"
needless_else = "warn"
redundant_else = "warn"

[dependencies]
cherenkov-model-data = { path = "crates/model-data" }
anstream = "1"
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
dirs = "7"
half = "2.7.1"
hf-hub = { version = "1", features = ["blocking"] }
libc = "0.2"
memmap2 = "0.9.11"
minijinja = { version = "2.24", features = ["loader", "fuel", "json"] }
minijinja-contrib = { version = "2.24", features = ["pycompat"] }
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-metal = "0.3.2"
rayon = "1.12.0"
rand = "0.9.5"
reqwest = { version = "0.13", features = ["blocking", "json"] }
sha2 = "0.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tabled = { version = "0.22", default-features = false, features = ["derive"] }
tokenizers = "0.23.1"
toml = "1.1"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
textwrap = { version = "0.16", default-features = false, features = ["unicode-width", "unicode-linebreak"] }
tui-scrollview = "0.6"

[dev-dependencies]
tempfile = "3"
