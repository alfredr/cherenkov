[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
anyhow = "1"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
regex = "1"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints.clippy]
cognitive_complexity = "warn"
