# Run: cherenkov serve /path/to/model --config cherenkov.example.toml
# Explicit CLI flags override this file, including after reload.

[server]
# model = "my-model" # Indexed model; mutually exclusive with model_dir.
# model_dir = "/path/to/model" # Omitted: use the pinned managed model.
# root = "/Volumes/Models/cherenkov" # Omitted: XDG data, cache and config directories.
port = 8080
# socket = "/private/path/control.sock" # Default: private directory under TMPDIR.
drafts = 2

[limits]
# Decimal GB: Metal buffers plus cache/session reservations, not total process RSS.
memory_gb = 25.0
context_tokens = 2048
prefix_cache_mib = 512
cache_max_entries = 16
cache_idle_seconds = 900 # 0 disables expiry; size limits still apply.
active_requests = 2 # Interleaved at decode-step or prefill-chunk boundaries.
active_state_mib = 1024 # CPU sequence checkpoints and per-request workspace.
prefill_quantum = 128 # Larger chunks need more scratch; try 4096 on larger Macs.
prefill_chunk_seconds = 2.0 # Target chunk duration when requests compete; 0 disables pacing.
max_sessions = 16 # 0 disables retained conversation history.
session_history_mib = 16
session_idle_seconds = 900 # Idle sessions expire; active turns are pinned.
queued_requests = 8
http_readers = 32
request_bytes = 4194304
response_bytes = 4194304
max_output_tokens = 262144 # Also constrained by the remaining context.

[defaults]
# This section can be reloaded. Requests already accepted keep their snapshot.
max_tokens = 64
no_eos = false
stream = false
include_usage = false

[defaults.sampling]
# Reloadable defaults for stateless requests and newly created sessions.
temperature = 0.0 # Greedy; nonzero sampling disables argmax MTP verification.
top_p = 1.0
top_k = 0 # 0 keeps the full vocabulary.
# seed = 42 # Omitted: independently seeded random streams.
presence_penalty = 0.0
frequency_penalty = 0.0

[experts]
resident_bits = 4
# miss_bits = 2 # Omitted: follows resident_bits. Mixed mode requires residents=4.
pool_gb = "adaptive" # Positive decimal GB, "adaptive", or "max".
cut_weak = 0.0 # Nonzero permits skipping late weak experts; output may vary.
build_missing_store = true # false: fail startup if selected low-bit store is unusable.
